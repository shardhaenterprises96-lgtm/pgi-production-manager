components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthSession:
      type: object
      required: [id, username, role, name]
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, salesman, store, manufacturing, accountant, customer]
        name:
          type: string
        customerId:
          type: ["integer", "null"]

    UserAccount:
      type: object
      required: [id, username, name, role, isActive, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, salesman, store, manufacturing, accountant, customer]
        entityId:
          type: ["integer", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    CreateUserInput:
      type: object
      required: [username, password, role]
      description: |
        Creates a login account. `name` falls back to the linked entity's name when omitted
        and an `entityId` is provided. Link a salesman/worker/customer entity via `entityId`
        so the login is associated with their ledger and invoice attribution.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 4
        name:
          type: string
        role:
          type: string
          enum: [admin, salesman, store, manufacturing, accountant, customer]
        entityId:
          type: ["integer", "null"]

    UpdateUserInput:
      type: object
      description: All fields optional. Send only the fields you want to change. Set `password` to a non-empty string to reset it.
      properties:
        name:
          type: string
        role:
          type: string
          enum: [admin, salesman, store, manufacturing, accountant, customer]
        isActive:
          type: boolean
        entityId:
          type: ["integer", "null"]
        password:
          type: string
          minLength: 4

    RolePermission:
      type: object
      required: [role, feature, allowed]
      properties:
        id:
          type: integer
        role:
          type: string
        feature:
          type: string
        allowed:
          type: boolean

    RolePermissionsUpdate:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            type: object
            required: [role, feature, allowed]
            properties:
              role:
                type: string
              feature:
                type: string
              allowed:
                type: boolean

    Product:
      type: object
      required: [id, name, group, brand, itemCode, unit, purchasePrice, retailPrice, wholesalePrice, mrp, currentStock, pricingBasis, notForSale, addForManufacturing]
      properties:
        id:
          type: integer
        name:
          type: string
        printName:
          type: ["string", "null"]
        group:
          type: string
        brand:
          type: string
        itemCode:
          type: string
        unit:
          type: string
        purchasePrice:
          type: number
        retailPrice:
          type: number
        wholesalePrice:
          type: number
        mrp:
          type: number
        minSalePrice:
          type: ["number", "null"]
        currentStock:
          type: number
        openingStock:
          type: ["number", "null"]
        openingStockValue:
          type: ["number", "null"]
        pricingBasis:
          type: string
          enum: [manual, fixed_margin]
        wholesaleMargin:
          type: ["number", "null"]
        retailMargin:
          type: ["number", "null"]
        hsnCode:
          type: ["string", "null"]
        taxRate:
          type: ["number", "null"]
        litersPerBox:
          type: ["number", "null"]
        unitsPerBox:
          type: ["number", "null"]
        notForSale:
          type: boolean
        addForManufacturing:
          type: boolean
        minStockThreshold:
          type: ["number", "null"]
        imageUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    ProductInput:
      type: object
      required: [name, group, brand, itemCode, unit, purchasePrice, retailPrice, wholesalePrice, mrp]
      properties:
        name:
          type: string
        printName:
          type: string
        group:
          type: string
        brand:
          type: string
        itemCode:
          type: string
        unit:
          type: string
        purchasePrice:
          type: number
        retailPrice:
          type: number
        wholesalePrice:
          type: number
        mrp:
          type: number
        minSalePrice:
          type: number
        openingStock:
          type: number
        openingStockValue:
          type: number
        pricingBasis:
          type: string
          enum: [manual, fixed_margin]
        wholesaleMargin:
          type: number
        retailMargin:
          type: number
        hsnCode:
          type: string
        taxRate:
          type: number
        litersPerBox:
          type: number
        unitsPerBox:
          type: number
        notForSale:
          type: boolean
        addForManufacturing:
          type: boolean
        minStockThreshold:
          type: number
        imageUrl:
          type: string

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
        printName:
          type: string
        group:
          type: string
        brand:
          type: string
        itemCode:
          type: string
        unit:
          type: string
        purchasePrice:
          type: number
        retailPrice:
          type: number
        wholesalePrice:
          type: number
        mrp:
          type: number
        minSalePrice:
          type: number
        pricingBasis:
          type: string
        wholesaleMargin:
          type: number
        retailMargin:
          type: number
        hsnCode:
          type: string
        taxRate:
          type: number
        litersPerBox:
          type: number
        unitsPerBox:
          type: number
        notForSale:
          type: boolean
        addForManufacturing:
          type: boolean
        minStockThreshold:
          type: number
        imageUrl:
          type: string

    StockMovement:
      type: object
      required: [id, productId, type, quantity, reason, createdAt]
      properties:
        id:
          type: integer
        productId:
          type: integer
        type:
          type: string
          enum: [inward, outward, adjustment, manufacturing_consume, manufacturing_produce, damage]
        quantity:
          type: number
        reason:
          type: string
        referenceId:
          type: ["integer", "null"]
        referenceType:
          type: ["string", "null"]
        userId:
          type: integer
        createdAt:
          type: string

    StockMovementInput:
      type: object
      required: [type, quantity, reason]
      properties:
        type:
          type: string
          enum: [inward, outward, adjustment, manufacturing_consume, manufacturing_produce, damage]
        quantity:
          type: number
        reason:
          type: string
        referenceId:
          type: integer
        referenceType:
          type: string

    Entity:
      type: object
      required: [id, type, name, mobile]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [customer, vendor, worker, salesman]
        name:
          type: string
        mobile:
          type: string
        gstin:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        pricingTier:
          type: ["string", "null"]
          enum: [retail, wholesale, null]
        outstandingBalance:
          type: number
        creditLimit:
          type: ["number", "null"]
        userId:
          type: ["integer", "null"]
        createdAt:
          type: string

    EntityInput:
      type: object
      required: [type, mobile]
      description: |
        `name` is optional ONLY for retail customers (walk-ins) — if omitted, the server
        generates a label like "Retail Customer (98765 43210)". For wholesale customers,
        vendors, workers, and salesmen the name is required.
      properties:
        type:
          type: string
          enum: [customer, vendor, worker, salesman]
        name:
          type: string
        mobile:
          type: string
        gstin:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        pricingTier:
          type: string
          enum: [retail, wholesale]
        creditLimit:
          type: number

    EntityUpdate:
      type: object
      properties:
        type:
          type: string
        name:
          type: string
        mobile:
          type: string
        gstin:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        pricingTier:
          type: string
        creditLimit:
          type: number

    EntityLookup:
      type: object
      required: [found]
      properties:
        found:
          type: boolean
        entity:
          $ref: "#/components/schemas/Entity"

    EntityLedger:
      type: object
      required: [entity, outstandingBalance, entries]
      properties:
        entity:
          $ref: "#/components/schemas/Entity"
        outstandingBalance:
          type: number
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"

    LedgerEntry:
      type: object
      required: [id, date, description, debit, credit, balance, type]
      properties:
        id:
          type: integer
        date:
          type: string
        description:
          type: string
        debit:
          type: number
        credit:
          type: number
        balance:
          type: number
        type:
          type: string
          enum: [invoice, payment, adjustment]
        referenceId:
          type: ["integer", "null"]
        referenceNo:
          type: ["string", "null"]

    Invoice:
      type: object
      required: [id, invoiceNo, invoiceDate, invoiceType, customerId, subtotal, totalTax, grandTotal, status]
      properties:
        id:
          type: integer
        invoiceNo:
          type: string
        invoiceDate:
          type: string
        dueDate:
          type: ["string", "null"]
        invoiceType:
          type: string
          enum: [gst, non_gst]
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        customerGstin:
          type: ["string", "null"]
        billingAddress:
          type: ["string", "null"]
        shippingAddress:
          type: ["string", "null"]
        placeOfSupply:
          type: string
        salesmanId:
          type: ["integer", "null"]
        salesmanName:
          type: ["string", "null"]
        poNumber:
          type: ["string", "null"]
        eWayBillNo:
          type: ["string", "null"]
        subtotal:
          type: number
        totalDiscount:
          type: number
        totalTax:
          type: number
        cgst:
          type: number
        sgst:
          type: number
        igst:
          type: number
        freight:
          type: number
        roundOff:
          type: number
        grandTotal:
          type: number
        amountPaid:
          type: number
        balanceDue:
          type: number
        status:
          type: string
          enum: [draft, saved, cancelled]
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItem"
        createdAt:
          type: string

    InvoiceItem:
      type: object
      required: [id, invoiceId, productId, productName, qty, unit, rate, amount]
      properties:
        id:
          type: integer
        invoiceId:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        hsnCode:
          type: ["string", "null"]
        qty:
          type: number
        qtyBoxes:
          type: ["number", "null"]
        totalLiters:
          type: ["number", "null"]
        unit:
          type: string
        rate:
          type: number
        mrp:
          type: number
        discountPct:
          type: number
        discountAmt:
          type: number
        taxPct:
          type: number
        cessPct:
          type: number
        netPrice:
          type: number
        amount:
          type: number

    InvoiceInput:
      type: object
      required: [invoiceType, invoiceDate, placeOfSupply, items]
      properties:
        invoiceType:
          type: string
          enum: [gst, non_gst]
        invoiceDate:
          type: string
        dueDate:
          type: string
        customerId:
          type: integer
        customerName:
          type: string
        contactNo:
          type: string
        customerGstin:
          type: string
        billingAddress:
          type: string
        shippingAddress:
          type: string
        placeOfSupply:
          type: string
        salesmanId:
          type: integer
        poNumber:
          type: string
        eWayBillNo:
          type: string
        freight:
          type: number
        roundOff:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItemInput"

    InvoiceItemInput:
      type: object
      required: [productId, qty, unit, rate, mrp]
      properties:
        productId:
          type: integer
        qty:
          type: number
        qtyBoxes:
          type: number
        litersPerBox:
          type: number
        unit:
          type: string
        rate:
          type: number
        mrp:
          type: number
        discountPct:
          type: number
        discountAmt:
          type: number
        taxPct:
          type: number
        cessPct:
          type: number

    InvoiceUpdate:
      type: object
      description: |
        Update an existing invoice. Two modes:
        - Header-only patch: send only status/dueDate (no stock or ledger impact).
        - Full edit: include `items` to fully replace line items, totals, customer, freight, etc.
          The server reverses the previous stock movements and ledger entry inside a SERIALIZABLE
          transaction and re-applies them with the new payload.
      properties:
        status:
          type: string
          enum: [draft, saved, cancelled]
        dueDate:
          type: string
        invoiceType:
          type: string
          enum: [gst, non_gst]
        invoiceDate:
          type: string
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        customerGstin:
          type: ["string", "null"]
        billingAddress:
          type: ["string", "null"]
        shippingAddress:
          type: ["string", "null"]
        placeOfSupply:
          type: string
        salesmanId:
          type: ["integer", "null"]
        poNumber:
          type: ["string", "null"]
        eWayBillNo:
          type: ["string", "null"]
        freight:
          type: number
        roundOff:
          type: number
        items:
          type: array
          description: When present, fully replaces line items and triggers stock/ledger reversal+reapply.
          items:
            $ref: "#/components/schemas/InvoiceItemInput"

    InvoiceSummary:
