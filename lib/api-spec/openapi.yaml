openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Shradha Oil Center ERP API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: products
  - name: entities
  - name: invoices
  - name: payments
  - name: rewards
  - name: manufacturing
  - name: dashboard
  - name: reports

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current session
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Not authenticated

  /auth/permissions:
    get:
      operationId: getRolePermissions
      tags: [auth]
      summary: Get role permissions matrix
      responses:
        "200":
          description: Permissions matrix
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RolePermission"

    put:
      operationId: updateRolePermissions
      tags: [auth]
      summary: Update role permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePermissionsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RolePermission"

  # USER ACCOUNTS (admin only)
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all user accounts (admin only)
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAccount"
        "403":
          description: Admin access required
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user account (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "409":
          description: Username already taken

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user account — rename, change role, reset password, toggle active, or relink entity (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"

  # PRODUCTS / INVENTORY
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: group
          in: query
          schema:
            type: string
        - name: brand
          in: query
          schema:
            type: string
        - name: forSale
          in: query
          schema:
            type: boolean
        - name: forManufacturing
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

    post:
      operationId: createProduct
      tags: [products]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found

    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /products/{id}/stock-movements:
    get:
      operationId: getProductStockMovements
      tags: [products]
      summary: Get stock movement history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovement"

    post:
      operationId: createStockMovement
      tags: [products]
      summary: Create stock movement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMovementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"

  /products/groups:
    get:
      operationId: listProductGroups
      tags: [products]
      summary: List product groups
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /products/brands:
    get:
      operationId: listBrands
      tags: [products]
      summary: List brands
      responses:
        "200":
          description: Brands
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  # ENTITIES (customers, vendors, workers, salesmen)
  /entities:
    get:
      operationId: listEntities
      tags: [entities]
      summary: List entities
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [customer, vendor, worker, salesman]
        - name: search
          in: query
          schema:
            type: string
        - name: mobile
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entity"

    post:
      operationId: createEntity
      tags: [entities]
      summary: Create entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"

  /entities/lookup:
    get:
      operationId: lookupEntityByMobile
      tags: [entities]
      summary: Lookup entity by mobile
      parameters:
        - name: mobile
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entity or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityLookup"

  /entities/{id}:
    get:
      operationId: getEntity
      tags: [entities]
      summary: Get entity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"

    patch:
      operationId: updateEntity
      tags: [entities]
      summary: Update entity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"

  /entities/{id}/ledger:
    get:
      operationId: getEntityLedger
      tags: [entities]
      summary: Get customer ledger
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityLedger"

  # INVOICES
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List invoices
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: customerId
          in: query
          schema:
            type: integer
        - name: salesmanId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
            enum: [gst, non_gst]
        - name: month
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: integer
        - name: dateFrom
          in: query
          description: Inclusive start date (YYYY-MM-DD) for invoice date filter
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: dateTo
          in: query
          description: Inclusive end date (YYYY-MM-DD) for invoice date filter
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, saved, cancelled]
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"

    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # PAYMENTS
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments
      parameters:
        - name: customerId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

    post:
      operationId: logPayment
      tags: [payments]
      summary: Log a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}/approve:
    post:
      operationId: approvePayment
      tags: [payments]
      summary: Approve payment (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}/reject:
    post:
      operationId: rejectPayment
      tags: [payments]
      summary: Reject payment (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  # ACCOUNTS (Cash / UPI / Bank)
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List all accounts
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /accounts/{id}:
    put:
      operationId: updateAccount
      tags: [accounts]
      summary: Update an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Delete (deactivate) an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # CASH BOOK — salesman cash collection
  /cashbook:
    get:
      operationId: getCashbook
      tags: [accounts]
      summary: Get cash book summary (per-salesman pending cash + account balances)
      responses:
        "200":
          description: Cashbook summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashbookSummary"

  /account-transactions:
    get:
      operationId: listAccountTransactions
      tags: [accounts]
      summary: List account transactions (cash in/out)
      parameters:
        - name: accountId
          in: query
          schema:
            type: integer
        - name: direction
          in: query
          schema:
            type: string
            enum: [in, out]
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountTransaction"
    post:
      operationId: createAccountTransaction
      tags: [accounts]
      summary: Record a Payment In or Payment Out against an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountTransactionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTransaction"

  /cashbook/collect:
    post:
      operationId: collectCashFromSalesman
      tags: [accounts]
      summary: Record cash collected from a salesman and deposit into an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectCashInput"
      responses:
        "200":
          description: Collected
          content:
            application/json:
              schema:
                type: object
                required: [collectedCount, totalAmount, account]
                properties:
                  collectedCount:
                    type: integer
                  totalAmount:
                    type: number
                  account:
                    $ref: "#/components/schemas/Account"

  # REWARD SCHEMES
  /reward-schemes:
    get:
      operationId: listRewardSchemes
      tags: [rewards]
      summary: List reward schemes
      responses:
        "200":
          description: Schemes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RewardScheme"

    post:
      operationId: createRewardScheme
      tags: [rewards]
      summary: Create reward scheme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardSchemeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardScheme"

  /reward-schemes/{id}:
    patch:
      operationId: updateRewardScheme
      tags: [rewards]
      summary: Update scheme
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardSchemeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardScheme"

    delete:
      operationId: deleteRewardScheme
      tags: [rewards]
      summary: Delete scheme
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /reward-progress:
    get:
      operationId: listRewardProgress
      tags: [rewards]
      summary: List reward progress for customers
      parameters:
        - name: customerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Progress list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RewardProgress"

  /reward-progress/{id}/disburse:
    post:
      operationId: disburseReward
      tags: [rewards]
      summary: Settle and disburse reward (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Disbursed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardProgress"

  # MANUFACTURING
  /boms:
    get:
      operationId: listBoms
      tags: [manufacturing]
      summary: List bills of materials
      responses:
        "200":
          description: BOMs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bom"

    post:
      operationId: createBom
      tags: [manufacturing]
      summary: Create BOM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BomInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bom"

  /boms/{id}:
    get:
      operationId: getBom
      tags: [manufacturing]
      summary: Get BOM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: BOM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bom"

    patch:
      operationId: updateBom
      tags: [manufacturing]
      summary: Update BOM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BomUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bom"

  /workload:
    get:
      operationId: listWorkloadCards
      tags: [manufacturing]
      summary: List workload pipeline cards
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, done]
      responses:
        "200":
          description: Cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkloadCard"

    post:
      operationId: createWorkloadCard
      tags: [manufacturing]
      summary: Create workload card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkloadCardInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadCard"

  /purchases:
    get:
      operationId: listPurchases
      tags: [purchases]
      summary: List purchase bills
      parameters:
        - name: vendorId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Purchases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Purchase"
    post:
      operationId: createPurchase
      tags: [purchases]
      summary: Create a purchase bill (atomic; adds stock + vendor payable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"

  /purchases/{id}:
    get:
      operationId: getPurchase
      tags: [purchases]
      summary: Get a purchase bill with line items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"

  /manufacturing/assemble:
    post:
      operationId: assembleItem
      tags: [manufacturing]
      summary: Atomically assemble a finished product from a BOM
      description: >
        Runs a BOM recipe in a single SERIALIZABLE transaction: creates a
        completed workload card, debits all required raw materials, credits the
        finished product stock, and writes stock movements. All-or-nothing —
        if any step fails (e.g. insufficient raw material) nothing is committed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssembleItemInput"
      responses:
        "201":
          description: Assembly committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadCard"
        "400":
          description: Invalid request (bad BOM, non-positive batches, etc.)
        "409":
          description: Insufficient raw material to assemble
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  shortages:
                    type: array
                    items:
                      type: object
                      properties:
                        materialProductId: { type: integer }
                        materialProductName: { type: string }
                        required: { type: number }
                        available: { type: number }
